name: Asset Collection Reminders

on:
  schedule:
    # Runs daily at 9:00 AM IST (3:30 AM UTC)
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send reminders
        env:
          DEVREV_PAT: ${{ secrets.DEVREV_PAT }}
          DEVREV_PAT_PEOPLEOPS: ${{ secrets.DEVREV_PAT_PEOPLEOPS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python notify.py
