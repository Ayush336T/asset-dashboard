name: Changappa Tickets Status

on:
  schedule:
    # Runs every 15 minutes
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Prevent overlapping runs from racing on git push; let the running one finish.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate changappa_status.json
        env:
          DEVREV_PAT_PEOPLEOPS: ${{ secrets.DEVREV_PAT_PEOPLEOPS }}
          DEVREV_PAT_DEVREV: ${{ secrets.DEVREV_PAT_DEVREV }}
        run: python changappa_status.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain changappa_status.json)" ]; then
            git add changappa_status.json
            git commit -m "chore: refresh changappa_status.json"
            git push
          else
            echo "No changes to commit."
          fi
