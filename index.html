<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offboarding Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f1117;
            color: #e4e4e7;
            padding: 24px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }
        .header .refresh-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        .header .refresh-btn:hover { background: #1d4ed8; }
        .header .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #1c1c24;
            border: 1px solid #2a2a35;
            border-radius: 8px;
            padding: 16px;
        }
        .stat-card .label {
            font-size: 12px;
            color: #a1a1aa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .stat-card .value {
            font-size: 28px;
            font-weight: 700;
            margin-top: 4px;
        }
        .stat-card .value.triage { color: #f59e0b; }
        .stat-card .value.wip { color: #3b82f6; }
        .stat-card .value.done { color: #10b981; }
        .stat-card .value.total { color: #e4e4e7; }
        .filters {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .filter-btn {
            background: #1c1c24;
            border: 1px solid #2a2a35;
            color: #a1a1aa;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .filter-btn.active {
            background: #2563eb;
            border-color: #2563eb;
            color: white;
        }
        .filter-btn:hover { border-color: #3b82f6; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #1c1c24;
            border-radius: 8px;
            overflow: hidden;
        }
        thead th {
            text-align: left;
            padding: 12px 16px;
            background: #16161d;
            font-size: 12px;
            color: #a1a1aa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #2a2a35;
        }
        tbody td {
            padding: 12px 16px;
            border-bottom: 1px solid #1f1f2a;
            font-size: 14px;
        }
        tbody tr:hover { background: #22222d; }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }
        .badge.triage { background: #78350f; color: #fbbf24; }
        .badge.wip { background: #1e3a5f; color: #60a5fa; }
        .badge.done { background: #064e3b; color: #34d399; }
        .badge.other { background: #2a2a35; color: #a1a1aa; }
        .issue-id {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 500;
        }
        .issue-id:hover { text-decoration: underline; }
        .employee-name { font-weight: 500; }
        .date { color: #a1a1aa; }
        .days-pending {
            font-weight: 600;
        }
        .days-pending.urgent { color: #ef4444; }
        .days-pending.warning { color: #f59e0b; }
        .days-pending.ok { color: #10b981; }
        .loading {
            text-align: center;
            padding: 40px;
            color: #a1a1aa;
        }
        .last-updated {
            font-size: 12px;
            color: #71717a;
        }
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            border-bottom: 1px solid #2a2a35;
        }
        .tab {
            background: transparent;
            border: none;
            color: #a1a1aa;
            padding: 10px 18px;
            cursor: pointer;
            font-size: 14px;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
        }
        .tab.active {
            color: #e4e4e7;
            border-bottom-color: #2563eb;
        }
        .tab:hover { color: #e4e4e7; }
        .view { display: none; }
        .view.active { display: block; }
        .badge.uber-pending { background: #78350f; color: #fbbf24; }
        .badge.uber-done { background: #064e3b; color: #34d399; }
        .badge.uber-warn { background: #1e3a5f; color: #60a5fa; }
        .badge.uber-unknown { background: #2a2a35; color: #a1a1aa; }
</style>
</head>
<body>
    <div class="header">
        <div>
            <h1>Offboarding Dashboard</h1>
            <span class="last-updated" id="lastUpdated"></span>
        </div>
        <div>
            <button class="refresh-btn" id="refreshBtn" onclick="fetchData()">Refresh</button>
            <button class="refresh-btn" style="background:#71717a;margin-left:8px" onclick="resetToken()">Reset Token</button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab active" data-view="assets" onclick="setView('assets')">Asset Collection</button>
        <button class="tab" data-view="uber" onclick="setView('uber')">Changappa</button>
    </div>

    <div class="view active" id="view-assets">

    <div class="stats" id="stats">
        <div class="stat-card"><div class="label">Total</div><div class="value total" id="statTotal">-</div></div>
        <div class="stat-card"><div class="label">Triage</div><div class="value triage" id="statTriage">-</div></div>
        <div class="stat-card"><div class="label">In Progress</div><div class="value wip" id="statWip">-</div></div>
        <div class="stat-card"><div class="label">Completed</div><div class="value done" id="statDone">-</div></div>
    </div>

    <div class="filters">
        <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">All</button>
        <button class="filter-btn" data-filter="triage" onclick="setFilter('triage')">Triage</button>
        <button class="filter-btn" data-filter="in_progress" onclick="setFilter('in_progress')">In Progress</button>
        <button class="filter-btn" data-filter="done" onclick="setFilter('done')">Completed</button>
        <span style="margin-left:auto;display:flex;align-items:center;gap:8px">
            <label style="font-size:13px;color:#a1a1aa">Assignee:</label>
            <select id="assigneeFilter" onchange="setAssigneeFilter(this.value)" style="background:#1c1c24;border:1px solid #2a2a35;color:#e4e4e7;padding:6px 10px;border-radius:6px;font-size:13px">
                <option value="all">Everyone</option>
                <option value="mine">My tickets</option>
            </select>
        </span>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Employee</th>
                <th>Task</th>
                <th>Stage</th>
                <th>Last Working Day</th>
                <th>Created</th>
                <th>Days Pending</th>
                <th>Assignee</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="8" class="loading">Loading...</td></tr>
        </tbody>
    </table>

    </div>

    <div class="view" id="view-uber">
        <div class="stats" id="changappaStats"></div>
        <div class="filters">
            <button class="filter-btn active" data-org="all" onclick="setOrgFilter('all')">All Orgs</button>
            <button class="filter-btn" data-org="peopleops" onclick="setOrgFilter('peopleops')">People Ops</button>
            <button class="filter-btn" data-org="devrev" onclick="setOrgFilter('devrev')">DevRev</button>
            <span style="margin-left:auto;display:flex;align-items:center;gap:8px">
                <label style="font-size:13px;color:#a1a1aa">Type:</label>
                <select id="kindFilter" onchange="setKindFilter(this.value)" style="background:#1c1c24;border:1px solid #2a2a35;color:#e4e4e7;padding:6px 10px;border-radius:6px;font-size:13px">
                    <option value="all">All types</option>
                    <option value="uber">Uber</option>
                    <option value="cab">Cab</option>
                    <option value="id_card">ID Card / Biometric</option>
                    <option value="asset">Asset Collection</option>
                    <option value="other">Other</option>
                </select>
            </span>
        </div>
        <div class="last-updated" id="uberUpdated" style="margin-bottom:12px"></div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Org</th>
                    <th>Type</th>
                    <th>Title</th>
                    <th>Stage</th>
                    <th>Created</th>
                    <th>LWD</th>
                </tr>
            </thead>
            <tbody id="uberBody">
                <tr><td colspan="7" class="loading">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        function getToken() {
            let token = localStorage.getItem('devrev_pat');
            if (!token || token.length < 50) {
                token = prompt('Paste your DevRev PAT token (the full eyJ... string):');
                if (token) {
                    token = token.trim();
                    if (token.startsWith('eyJ') && token.length > 100) {
                        localStorage.setItem('devrev_pat', token);
                        return token;
                    }
                }
                document.getElementById('tableBody').innerHTML =
                    '<tr><td colspan="8" class="loading">No valid token provided. Click "Reset Token" to try again.</td></tr>';
                return null;
            }
            return token;
        }
        function resetToken() {
            localStorage.removeItem('devrev_pat');
            location.reload();
        }
        const API_TOKEN = getToken();

        let allIssues = [];
        let currentFilter = 'all';
        let assigneeFilter = 'all';
        let currentUser = {};

        async function detectUser() {
            if (!API_TOKEN) return;
            try {
                const resp = await fetch('https://api.devrev.ai/dev-users.self', {
                    method: 'GET',
                    headers: { 'Authorization': API_TOKEN }
                });
                const data = await resp.json();
                currentUser = data.dev_user || {};
            } catch (e) {}
        }

        async function fetchData() {
            if (!API_TOKEN) return;
            const btn = document.getElementById('refreshBtn');
            btn.disabled = true;
            btn.textContent = 'Loading...';

            try {
                let issues = [];
                let cursor = null;

                do {
                    const body = { type: ['issue'], limit: 100 };
                    if (cursor) body.cursor = cursor;

                    const resp = await fetch('https://api.devrev.ai/works.list', {
                        method: 'POST',
                        headers: {
                            'Authorization': API_TOKEN,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(body)
                    });
                    const data = await resp.json();

                    const assetIssues = (data.works || []).filter(w =>
                        w.title && w.title.startsWith('Employee Name:')
                    );
                    issues.push(...assetIssues);
                    cursor = data.next_cursor;
                } while (cursor && issues.length < 500);

                allIssues = issues.map(w => {
                    let lwd = w.target_close_date || '';
                    if (!lwd && w.body) {
                        const match = w.body.match(/Last Working Day[:\s]*<\/?\w*>?\s*([^<\n]+)/i);
                        if (match) lwd = match[1].trim();
                    }
                    const owners = w.owned_by || [];
                    const titleParts = w.title.replace('Employee Name: ', '').split(' - ');
                    const employee = titleParts[0].trim();
                    const task = titleParts.slice(1).join(' - ').trim() || 'General';
                    return {
                        id: w.display_id,
                        title: w.title,
                        employee: employee,
                        task: task,
                        stage: w.stage?.name || 'unknown',
                        stageState: w.stage?.state?.name || '',
                        created: w.created_date,
                        lwd: lwd,
                        owners: owners,
                        assignee: owners.map(o => o.full_name || o.display_name).join(', '),
                        daysPending: Math.floor((Date.now() - new Date(w.created_date)) / 86400000)
                    };
                });

                allIssues.sort((a, b) => {
                    const aLwd = a.lwd ? new Date(a.lwd).getTime() : Infinity;
                    const bLwd = b.lwd ? new Date(b.lwd).getTime() : Infinity;
                    return aLwd - bLwd;
                });
                updateStats();
                renderTable();
                document.getElementById('lastUpdated').textContent =
                    `Last updated: ${new Date().toLocaleString()}`;
            } catch (err) {
                document.getElementById('tableBody').innerHTML =
                    `<tr><td colspan="8" class="loading">Error: ${err.message}</td></tr>`;
            }

            btn.disabled = false;
            btn.textContent = 'Refresh';
        }

        function updateStats() {
            const base = getFilteredByAssignee(allIssues);
            const triage = base.filter(i => i.stage === 'triage').length;
            const wip = base.filter(i => ['in_development', 'in_progress', 'work_in_progress'].includes(i.stage)).length;
            const done = base.filter(i => i.stageState === 'closed' || i.stage === 'done' || i.stage === 'resolved').length;

            document.getElementById('statTotal').textContent = base.length;
            document.getElementById('statTriage').textContent = triage;
            document.getElementById('statWip').textContent = wip;
            document.getElementById('statDone').textContent = done;
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`[data-filter="${filter}"]`).classList.add('active');
            renderTable();
        }

        function setAssigneeFilter(value) {
            assigneeFilter = value;
            updateStats();
            renderTable();
        }

        function getFilteredByAssignee(list) {
            if (assigneeFilter !== 'mine') return list;
            const email = currentUser.email || '';
            const displayId = currentUser.display_id || '';
            return list.filter(i => {
                return i.owners.some(o => {
                    if (email && o.email === email) return true;
                    if (displayId && o.display_id === displayId) return true;
                    return false;
                });
            });
        }

        function renderTable() {
            let filtered = getFilteredByAssignee(allIssues);
            if (currentFilter === 'triage') filtered = filtered.filter(i => i.stage === 'triage');
            else if (currentFilter === 'in_progress') filtered = filtered.filter(i => ['in_development', 'in_progress', 'work_in_progress'].includes(i.stage));
            else if (currentFilter === 'done') filtered = filtered.filter(i => i.stageState === 'closed' || i.stage === 'done' || i.stage === 'resolved');

            if (!filtered.length) {
                document.getElementById('tableBody').innerHTML =
                    '<tr><td colspan="8" class="loading">No issues found</td></tr>';
                return;
            }

            document.getElementById('tableBody').innerHTML = filtered.map(issue => {
                const badgeClass = issue.stage === 'triage' ? 'triage' :
                    ['in_development', 'in_progress', 'work_in_progress'].includes(issue.stage) ? 'wip' :
                    (issue.stageState === 'closed' || issue.stage === 'done') ? 'done' : 'other';

                const daysClass = issue.daysPending > 14 ? 'urgent' :
                    issue.daysPending > 7 ? 'warning' : 'ok';

                const lwdDisplay = issue.lwd ? new Date(issue.lwd).toLocaleDateString() : '-';
                const lwdDate = issue.lwd ? new Date(issue.lwd) : null;
                const lwdClass = lwdDate && lwdDate < new Date() ? 'urgent' :
                    lwdDate && (lwdDate - new Date()) < 7 * 86400000 ? 'warning' : '';

                return `<tr>
                    <td><a class="issue-id" href="https://app.devrev.ai/peopleops/works/${issue.id}" target="_blank">${issue.id}</a></td>
                    <td class="employee-name">${issue.employee}</td>
                    <td>${issue.task}</td>
                    <td><span class="badge ${badgeClass}">${issue.stage}</span></td>
                    <td class="date ${lwdClass}">${lwdDisplay}</td>
                    <td class="date">${new Date(issue.created).toLocaleDateString()}</td>
                    <td><span class="days-pending ${daysClass}">${issue.daysPending}d</span></td>
                    <td>${issue.assignee}</td>
                </tr>`;
            }).join('');
        }

        function setView(name) {
            document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === name));
            document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === `view-${name}`));
            if (name === 'uber') loadUberStatus();
        }

        const KIND_LABEL = {
            uber: 'Uber',
            cab: 'Cab',
            id_card: 'ID Card',
            asset: 'Asset Collection',
            other: 'Other',
        };

        let changappaTickets = [];
        let orgSummaries = [];
        let kindFilter = 'all';
        let orgFilter = 'all';

        function setKindFilter(k) {
            kindFilter = k;
            renderChangappaTable();
        }

        function setOrgFilter(o) {
            orgFilter = o;
            document.querySelectorAll('#view-uber .filter-btn').forEach(b => b.classList.toggle('active', b.dataset.org === o));
            renderChangappaTable();
        }

        async function loadUberStatus() {
            const body = document.getElementById('uberBody');
            try {
                const resp = await fetch(`changappa_status.json?t=${Date.now()}`);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const data = await resp.json();
                changappaTickets = data.tickets || [];
                orgSummaries = data.orgs || [];

                renderChangappaStats();
                document.getElementById('uberUpdated').textContent =
                    `Last refreshed: ${new Date(data.generated_at).toLocaleString()}`;
                renderChangappaTable();
            } catch (err) {
                body.innerHTML = `<tr><td colspan="7" class="loading">Could not load changappa_status.json (${err.message}). The GitHub Action may not have run yet.</td></tr>`;
            }
        }

        function renderChangappaStats() {
            const stats = document.getElementById('changappaStats');
            const cards = [];
            cards.push(`<div class="stat-card"><div class="label">Total Open</div><div class="value total">${changappaTickets.length}</div></div>`);
            for (const org of orgSummaries) {
                const cls = org.error ? 'triage' : 'wip';
                const value = org.error ? 'error' : (org.count ?? 0);
                cards.push(`<div class="stat-card"><div class="label">${org.label}</div><div class="value ${cls}">${value}</div>${org.error ? `<div style="font-size:11px;color:#ef4444;margin-top:4px">${org.error.slice(0, 60)}</div>` : ''}</div>`);
            }
            stats.innerHTML = cards.join('');
        }

        function renderChangappaTable() {
            const body = document.getElementById('uberBody');
            let tickets = changappaTickets;
            if (orgFilter !== 'all') tickets = tickets.filter(t => t.org === orgFilter);
            if (kindFilter !== 'all') tickets = tickets.filter(t => t.kind === kindFilter);

            if (!tickets.length) {
                body.innerHTML = '<tr><td colspan="7" class="loading">No tickets found</td></tr>';
                return;
            }

            tickets = [...tickets].sort((a, b) => {
                const aLwd = a.lwd ? new Date(a.lwd).getTime() : Infinity;
                const bLwd = b.lwd ? new Date(b.lwd).getTime() : Infinity;
                if (aLwd !== bLwd) return aLwd - bLwd;
                return new Date(b.created || 0) - new Date(a.created || 0);
            });

            body.innerHTML = tickets.map(t => {
                const lwd = t.lwd ? new Date(t.lwd).toLocaleDateString() : '-';
                const created = t.created ? new Date(t.created).toLocaleDateString() : '-';
                const lwdDate = t.lwd ? new Date(t.lwd) : null;
                const lwdClass = lwdDate && lwdDate < new Date() ? 'urgent' :
                    lwdDate && (lwdDate - new Date()) < 7 * 86400000 ? 'warning' : '';
                return `<tr>
                    <td><a class="issue-id" href="${t.url}" target="_blank">${t.id}</a></td>
                    <td><span class="badge other">${t.org_label || t.org}</span></td>
                    <td><span class="badge other">${KIND_LABEL[t.kind] || t.kind}</span></td>
                    <td>${t.title || '-'}</td>
                    <td><span class="badge other">${t.stage || '-'}</span></td>
                    <td class="date">${created}</td>
                    <td class="date ${lwdClass}">${lwd}</td>
                </tr>`;
            }).join('');
        }

        detectUser().then(() => fetchData());
    </script>
</body>
</html>
